name: Build and Publish Multi-Arch Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "Exact @deepseek-ai/dsh npm version to package"
        required: true
        default: "0.2.2-rc.5"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  test-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run entrypoint unit tests
        run: node --test docker/entrypoint.test.mjs

  build-and-push:
    needs: test-entrypoint
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DSH_VERSION="${{ inputs.dsh_version }}"
          else
            DSH_VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "dsh_version=${DSH_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging @deepseek-ai/dsh@${DSH_VERSION}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.dsh_version }}
            type=raw,value=v${{ steps.version.outputs.dsh_version }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.version.outputs.dsh_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify multi-arch manifest list
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          REF="${IMAGE_LOWER}:${{ steps.version.outputs.dsh_version }}@${{ steps.build.outputs.digest }}"
          echo "Published multi-arch image: ${REF}"
          docker buildx imagetools inspect "${REF}"
          {
            echo "### Published Image"
            echo ""
            echo "\`${REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
