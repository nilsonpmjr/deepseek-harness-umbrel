manifestVersion: 1.1
id: deepseek-harness
storage:
  dataRoot: data
folderAccess:
  - id: shared-folder
    name: Shared Folder
    note: Select a folder from your Umbrel to access inside DeepSeek Harness at /data/shared.
    mounts:
      - service: web
        targetPath: /data/shared
category: ai
name: DeepSeek Harness
version: "0.2.2-rc.5"
tagline: Open-source AI agent workbench powered by Cordis
icon: "data:image/svg+xml;base64,"
description: >-
  DeepSeek Harness (dsh) is an open-source AI agent workbench developed by DeepSeek AI
  on an everything-is-a-plugin architecture powered by Cordis.


  On first launch, follow the in-browser setup dialog (or open Settings -> Models) to add
  your DeepSeek API key or connect third-party and custom model providers (OpenAI, Anthropic,
  Gemini, Ollama, OpenRouter, and OpenAI/Anthropic-compatible endpoints). Note: DeepSeek
  Account browser sign-in requires localhost, so remote Umbrel access uses API keys.


  ## Features

  - Full-featured Web UI for multi-turn agent workflows, tool execution, and session history

  - Built-in model provider manager supporting DeepSeek, major cloud APIs, and local/custom endpoints

  - Integrated file browser, workspace management, terminal, and extensible Cordis plugin ecosystem

  - Runs isolated inside the Umbrel app container with all sessions, credentials, and workspaces persisted in app data
